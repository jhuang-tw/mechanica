<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d12">
<meta name="description" content="修好一台壞掉的機器：看症狀、說出你的猜測，Meta AI 在 3D 模型上幫你檢查；也能一步一步學它的原理。">
<title>Mechanica · 修好它，就懂了</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --bg:#0a0d12; --card:#141a22; --card2:#1a222c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --text:#f2f5f8; --dim:#9aa6b4; --mute:#6b7785; --accent:#ffb02e; --accent2:#ffc861; --ink:#1c1303; --ok:#4fd08a; --bad:#ff6b5e;
    --glass:rgba(14,19,26,.72); --well:#babbbd; --r:18px;
    --sans: system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --display: "Space Grotesk", var(--sans);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:16px/1.5 var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font:inherit; color:inherit; background:var(--card2); border:1px solid var(--line); border-radius:12px; cursor:pointer; transition:transform .12s, background .15s, border-color .15s; }
  button:active { transform:scale(.97); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  [hidden] { display:none !important; }
  svg.i { width:22px; height:22px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- landing ---------- */
  #home { position:fixed; inset:0; overflow-y:auto; overflow-x:hidden; background:
      radial-gradient(900px 500px at 85% -10%, rgba(255,176,46,.13), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(90,150,255,.08), transparent 60%), var(--bg); }
  .wrap { width:min(1080px,100%); margin:0 auto; padding:0 16px; }
  .top { display:flex; align-items:center; justify-content:space-between; min-height:40px; padding-top:calc(14px + env(safe-area-inset-top)); }
  .mark { display:flex; align-items:center; gap:10px; font:700 17px/1 var(--display); letter-spacing:.14em; }
  .mark svg { width:26px; height:26px; color:var(--accent); }
  .pill { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border-radius:999px; font-size:14px; font-weight:600; background:rgba(255,255,255,.06); border:1px solid var(--line2); }
  .pill svg.i { width:18px; height:18px; }

  section.block { padding:36px 0 0; }
  .h2 { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:0 0 14px; }
  .h2 h2 { margin:0; font-size:22px; }
  .h2 span { color:var(--mute); font-size:13px; }

  .pick { padding:26px 0 18px; }
  .pick h1 { margin:0; font-size:clamp(32px, 9vw, 52px); line-height:1.15; font-weight:800; }
  .pick h1 em { font-style:normal; color:var(--accent); }
  .pick .lede { margin:10px 0 0; color:var(--dim); font-size:15px; max-width:34em; }
  .tile .n.done { background:var(--ok); }
  #tiles { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  .tile { display:flex; flex-direction:column; padding:0; overflow:hidden; text-align:left; border-radius:var(--r); background:var(--card); border:1px solid var(--line); }
  .tile:hover { border-color:var(--line2); background:var(--card2); }
  .tile .well { position:relative; aspect-ratio:1; background:var(--well); overflow:hidden; }
  .tile .well::after { content:""; position:absolute; inset:0; background:radial-gradient(closest-side, transparent 62%, rgba(0,0,0,.18)); }
  .tile img { display:block; width:100%; height:100%; object-fit:cover; transition:transform .4s; }
  .tile:hover img { transform:scale(1.04); }
  .tile .n { position:absolute; z-index:1; top:8px; left:8px; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#10151c; background:rgba(255,255,255,.85); }
  .tile .body { display:flex; flex-direction:column; gap:3px; padding:12px 12px 14px; flex:1; }
  .tile b { font-size:17px; line-height:1.25; }
  .tile small { color:var(--mute); font-size:12px; line-height:1.4; }
  .tile .first { margin-top:auto; padding-top:8px; display:flex; align-items:center; gap:6px; color:var(--dim); font-size:13px; line-height:1.3; }
  .tile .first svg.i { width:15px; height:15px; color:var(--accent); }

  .ic { display:grid; place-items:center; width:42px; height:42px; flex:none; border-radius:12px; background:rgba(255,176,46,.12); color:var(--accent); }
  #home-photo { display:flex; align-items:center; gap:14px; width:100%; margin:0; padding:16px; text-align:left; border-radius:var(--r); background:transparent; border:1px dashed var(--line2); color:var(--dim); }
  #home-photo .ic { background:rgba(255,255,255,.06); color:var(--text); }
  #home-photo b { display:block; color:var(--text); font-size:15px; }
  #home-photo span span { font-size:13px; }
  .foot { padding:28px 0 calc(28px + env(safe-area-inset-bottom)); color:var(--mute); font-size:12px; text-align:center; }

  @media (min-width:760px) {
    #tiles { grid-template-columns:repeat(4, minmax(0,1fr)); gap:16px; }
  }

  /* ---------- exhibit ---------- */
  #app { position:fixed; inset:0; background:var(--bg); }
  #view { position:absolute; inset:0; }
  #view canvas { display:block; width:100%; height:100%; touch-action:none; }
  header { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top)) 12px 24px; pointer-events:none; z-index:1; background:linear-gradient(rgba(10,13,18,.75), transparent); }
  header > * { pointer-events:auto; }
  header .ttl { flex:1; min-width:0; pointer-events:none; }
  header h2 { margin:0; font-size:17px; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header small { display:block; color:var(--dim); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon { display:grid; place-items:center; width:44px; height:44px; padding:0; background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  #vr { display:flex; width:auto; gap:6px; padding:0 14px; font-size:14px; font-weight:700; color:var(--ink); background:var(--accent); border:0; }
  #vr svg.i { width:18px; height:18px; }
  #sheet { position:absolute; left:0; right:0; bottom:0; margin:0 auto; width:min(640px,100%); padding:0 10px calc(10px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px; z-index:1; }
  .glass { background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2); }
  #caption { border-radius:var(--r); padding:12px 16px 13px; max-height:30vh; overflow:auto; box-shadow:0 12px 30px -12px rgba(0,0,0,.6); }
  #caption b { display:inline-block; margin-bottom:4px; padding:2px 9px; border-radius:999px; font-size:12px; color:var(--accent2); background:rgba(255,176,46,.14); }
  #caption b:empty { display:none; }
  #caption p { margin:0; font-size:15px; line-height:1.6; }
  #caption.thinking p::after { content:"…"; animation:blink 1s infinite; }
  @keyframes blink { 50% { opacity:.2; } }
  .row { display:flex; gap:8px; align-items:center; }
  body.lesson .chips, body.lesson #controls, body.riding .chips, body.riding #controls { display:none; }
  #ride { border-radius:16px; padding:8px 10px; display:grid; gap:8px; }
  #ride .row { justify-content:space-between; }
  #ride b { flex:1; font-size:14px; font-variant-numeric:tabular-nums; }
  #ride label { color:var(--dim); font-size:13px; } #ride input { flex:1; height:44px; margin:0; accent-color:var(--accent); }
  #ride button { min-width:44px; height:44px; padding:0 10px; border-radius:12px; display:grid; place-items:center; }
  #r-see[aria-pressed=true], #r-gears button.on { background:var(--accent); color:#1a1205; border-color:transparent; }
  #r-gears button { flex:1; min-width:0; white-space:nowrap; } #r-gears::before { content:"檔位"; color:var(--dim); font-size:13px; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:none; display:flex; align-items:center; gap:7px; min-height:44px; padding:0 14px 0 11px; font-size:14px; border-radius:999px; background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); white-space:nowrap; }
  .chip svg.i { width:17px; height:17px; }
  .chip.lesson { border-color:rgba(255,176,46,.45); }
  .chip.lesson svg.i { color:var(--accent); }
  .chip.ai { border-color:rgba(120,180,255,.4); }
  .chip.ai svg.i { color:#8ec5ff; }
  .chip.ask { font-weight:700; color:#0b1a2e; background:#8ec5ff; border:0; }
  .chip.ask svg.i { color:#0b1a2e; }
  #explode { flex:1; min-width:0; display:flex; align-items:center; gap:10px; height:48px; padding:0 14px; border-radius:14px; font-size:13px; color:var(--dim); }
  #explode svg.i { width:20px; height:20px; color:var(--text); }
  #explode input { flex:1; min-width:0; height:44px; margin:0; accent-color:var(--accent); }
  #controls .icon { flex:none; width:48px; height:48px; border-radius:14px; }
  #mic { display:grid; place-items:center; flex:none; width:60px; height:60px; padding:0; border-radius:50%; background:var(--accent); color:var(--ink); border:0; box-shadow:0 8px 24px -6px rgba(255,176,46,.6); }
  #mic svg.i { width:26px; height:26px; stroke-width:2; }
  #mic.rec { background:var(--bad); color:#fff; box-shadow:0 0 0 8px rgba(255,107,94,.25); animation:pulse 1.2s infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 14px rgba(255,107,94,.1); } }
  #ask { display:flex; gap:8px; padding:6px; border-radius:16px; }
  #ask input { flex:1; min-width:0; padding:10px 12px; font:inherit; color:var(--text); background:transparent; border:0; outline:none; }
  #ask button { padding:0 18px; background:var(--accent); color:var(--ink); border:0; font-weight:700; }
  #lesson { justify-content:space-between; border-radius:16px; padding:4px; }
  #lesson span { flex:1; text-align:center; font-size:14px; color:var(--dim); }
  #lesson span::before { content:""; display:block; height:3px; margin:0 8px 6px; border-radius:2px; background:linear-gradient(90deg, var(--accent) var(--p,0%), rgba(255,255,255,.12) 0); }
  #lesson button { display:grid; place-items:center; width:44px; height:44px; padding:0; border:0; background:none; }
  #lesson button:disabled { opacity:.3; }
  #lesson button.mode { width:auto; padding:0 10px; font-size:14px; font-weight:600; color:var(--accent); }
  body.tutor .chips, body.tutor #caption { display:none; }
  body.fix .chips, body.fix #caption, body.fix #explode, body.fix #photo, body.fix #lesson { display:none; }
  body.fix #controls { justify-content:flex-end; }
  .seg { display:flex; flex:none; padding:3px; border-radius:12px; background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  .seg button { min-height:36px; padding:0 12px; border:0; border-radius:9px; background:none; font-size:14px; font-weight:600; color:var(--dim); }
  .seg button[aria-pressed=true] { background:var(--accent); color:var(--ink); }
  #fix { border-radius:var(--r); padding:4px 6px 10px 14px; display:grid; grid-template-columns:minmax(0,1fr); gap:6px; max-height:40vh; overflow:auto; box-shadow:0 12px 30px -12px rgba(0,0,0,.6); }
  #fix .row b { flex:1; font-size:12px; color:var(--accent2); }
  #f-help { min-height:36px; padding:0 12px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--line2); color:var(--text); font-size:13px; }
  #f-v { margin:0; font-size:14px; line-height:1.5; } #f-v:empty { display:none; }
  #f-v.right b { color:var(--ok); } #f-v.partial b { color:var(--accent2); } #f-v.wrong b { color:var(--bad); }
  #f-q { margin:0; font-size:16px; font-weight:700; line-height:1.45; }
  #fix.thinking #f-q::after { content:" …"; animation:blink 1s infinite; }
  #f-choices { display:flex; flex-wrap:wrap; gap:6px; } #f-choices:empty { display:none; }
  #f-choices button { padding:8px 13px; font-size:14px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--line2); }
  #f-choices button.go { background:var(--accent); color:var(--ink); border:0; font-weight:700; }
  #f-hint { color:var(--dim); font-size:12px; }
  #tutor { border-radius:var(--r); padding:4px 6px 10px 14px; display:grid; grid-template-columns:minmax(0,1fr); gap:4px; max-height:34vh; overflow:auto; }
  #tutor .row b { flex:1; font-size:12px; color:#8ec5ff; }
  #tutor .row button { min-height:36px; padding:0 10px; border:0; background:none; color:var(--dim); font-size:13px; }
  #t-v { margin:0; font-size:14px; line-height:1.5; } #t-v:empty { display:none; }
  #t-v.right b { color:var(--ok); } #t-v.partial b { color:var(--accent2); } #t-v.wrong b { color:var(--bad); }
  #t-q { margin:0; font-size:15px; font-weight:700; line-height:1.45; }
  #tutor.thinking #t-q::after { content:" …"; animation:blink 1s infinite; }
  #t-choices { display:flex; flex-wrap:wrap; gap:6px; } #t-choices:empty { display:none; }
  #t-choices button { padding:7px 12px; font-size:14px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid var(--line2); }
  #t-choices div { flex:1 1 100%; min-width:0; font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #t-choices div::before { content:"✗ "; color:var(--bad); font-weight:700; }
  #t-hint { color:var(--dim); font-size:12px; }
  #quiz { display:grid; gap:8px; }
  #quiz button { padding:13px 16px; text-align:left; border-radius:14px; background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
  #quiz button.right { border-color:var(--ok); background:rgba(40,120,75,.55); }
  #quiz button.wrong { border-color:var(--bad); background:rgba(130,40,35,.55); }
  #toast { position:fixed; left:50%; top:calc(70px + env(safe-area-inset-top)); transform:translateX(-50%); z-index:5; padding:9px 16px; border-radius:999px; font-size:14px; background:var(--glass); border:1px solid var(--line2); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); white-space:nowrap; max-width:calc(100% - 32px); overflow:hidden; text-overflow:ellipsis; }
  /* a mouse can't swipe a row sideways: every chip stays in view, wrapped */
  @media (pointer:fine) { .chips { flex-wrap:wrap; overflow:visible; } }
  @media (min-width:900px) {
    #sheet { left:auto; right:8px; top:calc(76px + env(safe-area-inset-top)); bottom:8px; margin:0; width:464px; padding:12px; justify-content:flex-end; overflow-y:auto; scrollbar-width:thin; }
    #caption { max-height:none; }
    #caption p { font-size:16px; }
  }
  /* phone on its side: the sheet moves to the right so the model keeps the full height */
  @media (orientation:landscape) and (max-height:500px) { #sheet { left:auto; right:0; top:0; margin:0; width:min(400px,50vw); justify-content:flex-end; padding:calc(64px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) 10px; overflow-y:auto; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>

  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/><circle cx="12" cy="12" r="6.5"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19V5.5A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5 2.5 2.5 0 0 0 6.5 22H20v-5"/><path d="M8.5 7.5h7M8.5 11h4.5"/></symbol>
  <symbol id="i-q" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 2-2.7 2.4-2.7 4.1"/><path d="M12 17.6h.01"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M11 3l1.8 5.2L18 10l-5.2 1.8L11 17l-1.8-5.2L4 10l5.2-1.8z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></symbol>

<section id="home" hidden>
  <div class="wrap">
    <nav class="top">
      <div class="mark"><svg class="i"><use href="#i-gear"/></svg>MECHANICA</div>
      <button id="home-vr" class="pill" type="button" hidden><svg class="i"><use href="#i-vr"/></svg>VR 上課</button>
    </nav>

    <div class="pick">
      <h1>選一台來<em>修</em></h1>
      <p class="lede">每台機器都有一個地方壞了。看症狀、說出你的猜測，Meta AI 會在 3D 模型上幫你檢查，修好之後再說說看為什麼。</p>
    </div>

    <section class="block" id="all">
      <div id="tiles"></div>
    </section>

    <section class="block">
      <button id="home-photo" type="button"><span class="ic"><svg class="i"><use href="#i-cam"/></svg></span><span><b>身邊有真的機器？</b><span>拍下來，幫你找到對應的機器和零件</span></span></button>
    </section>
    <p class="foot">Mechanica · 手機、電腦和 VR 頭戴都能上課</p>
  </div>
</section>

<section id="app" hidden>
  <div id="view"><canvas id="c"></canvas></div>
  <header>
    <button id="back" class="icon" type="button" aria-label="回首頁"><svg class="i"><use href="#i-back"/></svg></button>
    <div class="ttl"><h2 id="title"></h2><small id="subtitle"></small></div>
    <div id="mode" class="seg" role="group" aria-label="模式"><button id="m-fix" type="button" aria-pressed="true">修理</button><button id="m-learn" type="button" aria-pressed="false">原理</button></div>
    <button id="vr" class="icon" type="button" hidden><svg class="i"><use href="#i-vr"/></svg>VR</button>
    <button id="reset" class="icon" type="button" aria-label="還原"><svg class="i"><use href="#i-reset"/></svg></button>
  </header>
  <div id="sheet">
    <div id="caption" class="glass"><b id="cap-title"></b><p id="cap-text"></p></div>
    <div id="quiz" hidden></div>
    <div id="fix" class="glass" hidden>
      <div class="row"><b id="f-bar">修理挑戰</b><button id="f-help" type="button">提示</button></div>
      <p id="f-v"></p><p id="f-q"></p><div id="f-choices"></div><small id="f-hint">按麥克風說你的猜測，或直接點你懷疑的零件</small>
    </div>
    <div id="tutor" class="glass" hidden>
      <div class="row"><b id="t-bar">AI 家教</b><button id="t-show" type="button">不會，示範給我看</button><button id="t-stop" type="button" aria-label="結束家教"><svg class="i"><use href="#i-x"/></svg></button></div>
      <p id="t-v"></p><p id="t-q"></p><div id="t-choices"></div><small id="t-hint" hidden>按麥克風用說的，或點鍵盤打字回答</small>
    </div>
    <div id="lesson" class="row glass" hidden>
      <button id="l-prev" type="button" aria-label="上一步"><svg class="i"><use href="#i-back"/></svg></button><span id="l-step"></span>
      <button id="l-next" type="button" aria-label="下一步"><svg class="i"><use href="#i-next"/></svg></button><button id="l-all" class="mode" type="button" aria-label="連貫播放和分步切換">連貫</button><button id="l-stop" type="button" aria-label="結束"><svg class="i"><use href="#i-x"/></svg></button>
    </div>
    <div id="ride" class="glass" hidden>
      <div class="row"><b id="r-read"></b><button id="r-see" type="button" aria-pressed="false">透視</button><button id="r-stop" type="button" aria-label="下車"><svg class="i"><use href="#i-x"/></svg></button></div>
      <label class="row">油門<input id="r-thr" type="range" min="0" max="1" step="0.01" value="0.3" aria-label="油門"></label>
      <div id="r-gears" class="row"></div>
    </div>
    <div id="chips" class="chips"></div>
    <div id="ai-chips" class="chips"></div>
    <form id="ask" class="glass" hidden><input id="q" enterkeyhint="send" autocomplete="off" placeholder="問任何問題…"><button type="submit">送出</button></form>
    <div id="controls" class="row">
      <label id="explode" class="glass"><svg class="i"><use href="#i-layers"/></svg>拆解<input id="explode-r" type="range" min="0" max="1" step="0.01" value="0" aria-label="拆解"></label>
      <button id="type" class="icon" type="button" aria-label="打字提問"><svg class="i"><use href="#i-key"/></svg></button>
      <button id="photo" class="icon" type="button" aria-label="拍真的機器"><svg class="i"><use href="#i-cam"/></svg></button>
      <button id="mic" type="button" aria-label="按住說話"><svg class="i"><use href="#i-mic"/></svg></button>
    </div>
  </div>
</section>
<div id="toast" hidden></div>
<input id="photo-in" type="file" accept="image/*" capture="environment" hidden>
<script type="module" src="/src/main.js"></script>
</body>
</html>
